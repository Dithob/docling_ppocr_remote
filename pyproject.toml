[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docling-ppocr-remote"
version = "0.1.0"
description = "Docling plugin for remote PP-OCR"
readme = "README.md"
requires-python = ">=3.8"

[project.entry-points."docling"]
ppocr_remote = "docling_ppocr_remote.plugin"
